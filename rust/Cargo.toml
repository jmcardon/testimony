[workspace]
resolver = "2"
members = [
    "crates/testimony-protocol",
    "crates/testimony-afpacket",
    "crates/testimony-client",
    "crates/testimonyd",
    "crates/testclient",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.74"

[workspace.dependencies]
libc = "0.2"
nix = { version = "0.29", default-features = false, features = ["fs", "socket", "uio", "signal", "user", "poll", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
log = "0.4"
env_logger = "0.11"

testimony-protocol = { path = "crates/testimony-protocol" }
testimony-afpacket = { path = "crates/testimony-afpacket" }
testimony-client = { path = "crates/testimony-client" }

[profile.release]
lto = "thin"
codegen-units = 1
# `panic = "unwind"` (the default) is load-bearing: the daemon must always
# get a chance to munmap its AF_PACKET ring and unlink its .sock files even
# when something panics. With `panic = "abort"` a thread panic kills the
# process immediately, no Drop runs, and we leak the kernel ring (the very
# thing the rewrite is meant to fix). The daemon installs a panic hook
# that flips the global shutdown flag so the main thread can still drive
# orderly cleanup.
strip = "symbols"
