[package]
name = "testimony-client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Client library for testimonyd (Rust API + C ABI)"

[lib]
name = "testimony"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
testimony-protocol.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
log.workspace = true

# Manual A/B perf harness for the buffered-recv hot path. Linux-only
# because it pokes `libc::recv` directly. Run with:
#   cargo build --release -p testimony-client --benches
#   ./target/release/deps/recv_throughput-XXXX
[[bench]]
name = "recv_throughput"
path = "benches/recv_throughput.rs"
harness = false
test = false
bench = false
